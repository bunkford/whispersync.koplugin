# Publish a plugin release for ZenPM. This repository holds two plugins that
# share one ZenPM source: Kindle Whispersync (whispersync.koplugin, tags
# vX.Y.Z) and Read Aloud (readaloud.koplugin, tags readaloud-vX.Y.Z).
#
# Trigger: push a tag, or run it by hand choosing the plugin with "publish"
# ticked to release the version currently in that plugin's _meta.lua (the tag
# is then created by the release itself).
# Steps: run both plugins' desktop tests, check the tag matches _meta.lua,
# build the zip, create the GitHub release with the asset, then record the
# release in zenpm/ on the default branch and redeploy GitHub Pages (a
# workflow's own commit never triggers the pages workflow, so this one does it).
name: release

on:
  push:
    tags: ["v*", "readaloud-v*"]
  workflow_dispatch:
    inputs:
      plugin:
        description: "Which plugin"
        type: choice
        options: [whispersync, readaloud]
        default: whispersync
      publish:
        description: "Publish a release for the version in that plugin's _meta.lua (creates its tag)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install LuaJIT and Python cryptography
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q luajit zip
          python3 -m pip install --quiet cryptography

      - name: Run plugin tests
        run: |
          sh whispersync.koplugin/tests/run.sh
          sh readaloud.koplugin/tests/run.sh

      - name: Which plugin
        id: which
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" != "$GITHUB_REF" ]; then
            case "$REF" in
              readaloud-v*) echo "plugin=readaloud" >> "$GITHUB_OUTPUT"; echo "prefix=readaloud-v" >> "$GITHUB_OUTPUT" ;;
              v*)           echo "plugin=whispersync" >> "$GITHUB_OUTPUT"; echo "prefix=v" >> "$GITHUB_OUTPUT" ;;
              *) echo "unrecognised tag $REF" >&2; exit 1 ;;
            esac
          else
            P="${{ inputs.plugin }}"
            echo "plugin=$P" >> "$GITHUB_OUTPUT"
            if [ "$P" = "whispersync" ]; then echo "prefix=v" >> "$GITHUB_OUTPUT"; else echo "prefix=$P-v" >> "$GITHUB_OUTPUT"; fi
          fi

      - name: Build the plugin archive
        id: build
        run: sh tools/build_plugin.sh "${{ steps.which.outputs.plugin }}" --print >> "$GITHUB_OUTPUT"

      - name: Decide whether this run publishes
        id: mode
        run: |
          PREFIX="${{ steps.which.outputs.prefix }}"
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "${TAG#$PREFIX}" != "${{ steps.build.outputs.VERSION }}" ]; then
              echo "tag $TAG does not match _meta.lua version ${{ steps.build.outputs.VERSION }}" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=${PREFIX}${{ steps.build.outputs.VERSION }}" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release name and notes
        if: steps.mode.outputs.publish == 'true'
        id: notes
        run: |
          P="${{ steps.which.outputs.plugin }}"
          if [ "$P" = "whispersync" ]; then NAME="Kindle Whispersync"; else NAME="Read Aloud (Edge voices)"; fi
          echo "name=$NAME ${{ steps.build.outputs.VERSION }}" >> "$GITHUB_OUTPUT"
          awk -v v="${{ steps.build.outputs.VERSION }}" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }' "$P.koplugin/CHANGELOG.md" > dist/notes.md
          [ -s dist/notes.md ] || echo "$NAME ${{ steps.build.outputs.VERSION }}" > dist/notes.md

      - name: Create the GitHub release
        if: steps.mode.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.mode.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: dist/notes.md
          files: dist/${{ steps.build.outputs.ASSET_NAME }}

      - name: Record the release in the ZenPM manifest on the default branch
        if: steps.mode.outputs.publish == 'true'
        run: |
          TAG="${{ steps.mode.outputs.tag }}"
          P="${{ steps.which.outputs.plugin }}"
          DEFAULT="${{ github.event.repository.default_branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT"
          git checkout "$DEFAULT"
          python3 tools/zenpm_manifest.py \
            --plugin "$P" \
            --tag "$TAG" \
            --asset-url "https://github.com/${{ github.repository }}/releases/download/$TAG/${{ steps.build.outputs.ASSET_NAME }}" \
            --size "${{ steps.build.outputs.SIZE }}" \
            --sha256 "${{ steps.build.outputs.SHA256 }}" \
            --source "https://github.com/${{ github.repository }}" \
            --repo-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          git add zenpm
          git commit -m "ZenPM manifest: ${{ steps.notes.outputs.name }}" || echo "manifest unchanged"
          git push origin "$DEFAULT"

  pages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - name: Site root is zenpm/
        run: |
          touch zenpm/.nojekyll
          cp zenpm/manifest.json zenpm/index.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: zenpm
      - id: deployment
        uses: actions/deploy-pages@v4
